[package]
name = "ma-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Music Assistant Rust server binary: HTTP API + WebSocket UI + log."

[[bin]]
name = "ma-server"
path = "src/main.rs"

[dependencies]
ma-core = { path = "../ma-core" }
ma-config = { path = "../ma-config" }
ma-runtime = { path = "../ma-runtime" }
ma-player-sendspin = { path = "../ma-player-sendspin" }
ma-player-sync-group = { path = "../ma-player-sync-group" }
ma-player-universal-group = { path = "../ma-player-universal-group" }
ma-player-bridge = { path = "../ma-player-bridge" }
ma-providers = { path = "../ma-providers" }
ma-provider-filesystem = { path = "../ma-provider-filesystem" }
ma-provider-radio = { path = "../ma-provider-radio" }
ma-provider-spotify = { path = "../ma-provider-spotify" }
ma-provider-s3 = { path = "../ma-provider-s3" }
ma-provider-cover = { path = "../ma-provider-cover" }
ma-provider-podcasts = { path = "../ma-provider-podcasts" }
ma-provider-ytmusic = { path = "../ma-provider-ytmusic" }
ma-ha = { path = "../ma-ha" }
ma-cache-s3 = { path = "../ma-cache-s3" }
ma-storage = { path = "../ma-storage" }

uuid = { workspace = true }
anyhow = { workspace = true }

tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
sqlx = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
axum = { workspace = true }
async-channel = "2"
parking_lot = { workspace = true }
