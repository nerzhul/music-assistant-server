[package]
name = "ma-library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Library controller: orchestrates filesystem scan + tag parse + DB persistence."

[dependencies]
ma-core = { path = "../ma-core" }
ma-providers = { path = "../ma-providers" }
ma-storage = { path = "../ma-storage" }
ma-provider-filesystem = { path = "../ma-provider-filesystem" }

async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
sha1_smol = "1"
url = { workspace = true }
once_cell = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util"] }
sqlx = { workspace = true, features = ["any", "sqlite"] }
ma-core = { path = "../ma-core" }
ma-providers = { path = "../ma-providers" }
ma-provider-filesystem = { path = "../ma-provider-filesystem" }
